<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indigoff</title>
    <meta
      name="description"
      content="Indigoff — acoustic panels, ceilings, lights and dividers made from 100% recycled PET."
    />
    <meta name="p:domain_verify" content="4af39f3fd4f068c84ca1d6b501d61593" />
    <link rel="icon" href="/img/favicon.svg" />
    <!-- Fuentes propias (ver @font-face en src/global.css): se piden desde el primer instante. -->
    <link rel="preload" href="/fonts/urbanist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Analítica: Google Analytics 4, Microsoft Clarity y Meta Pixel.
      - Solo en el dominio real: localhost, los deploys de prueba de Vercel y las pruebas automáticas no cuentan visitas.
      - Las colas (gtag, clarity, fbq) existen desde el inicio, así que nada se pierde; los scripts se piden cuando la
        página ya cargó y el navegador está libre, para no competir con el primer render.
      - Cambios de página sin recargar (Link, navigate): GA4 (enhanced measurement) y Meta Pixel escuchan el History API
        y Clarity sigue la SPA por su cuenta. No hace falta un page_view/PageView manual: se contarían dos veces.
    -->
    <script>
      if (/(^|\.)indigoff\.com$/.test(location.hostname)) {
        (function (w, d) {
          // Google Analytics 4
          w.dataLayer = w.dataLayer || [];
          w.gtag = function () {
            w.dataLayer.push(arguments);
          };
          w.gtag("js", new Date());
          w.gtag("config", "G-4KE5TSZB8R");
          // Microsoft Clarity
          w.clarity =
            w.clarity ||
            function () {
              (w.clarity.q = w.clarity.q || []).push(arguments);
            };
          // Meta Pixel (código base oficial, sin pedir el script todavía)
          if (!w.fbq) {
            var n = (w.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            });
            if (!w._fbq) w._fbq = n;
            n.push = n;
            n.loaded = true;
            n.version = "2.0";
            n.queue = [];
          }
          w.fbq("init", "1102587752576814");
          w.fbq("track", "PageView");

          function add(src) {
            var s = d.createElement("script");
            s.async = true;
            s.src = src;
            d.head.appendChild(s);
          }
          function load() {
            add("https://www.googletagmanager.com/gtag/js?id=G-4KE5TSZB8R");
            add("https://www.clarity.ms/tag/zdscazkqc4");
            add("https://connect.facebook.net/en_US/fbevents.js");
          }
          function idle() {
            if (w.requestIdleCallback) w.requestIdleCallback(load, { timeout: 3000 });
            else setTimeout(load, 1000);
          }
          if (d.readyState === "complete") idle();
          else w.addEventListener("load", idle, { once: true });
        })(window, document);
      }
    </script>
  </head>
  <body>
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=1102587752576814&ev=PageView&noscript=1"
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
